name: release

# Hosted Actions minutes are exhausted, so this runs on the self-hosted
# runner on 720, registered per repo (homelab's
# ansible/playbooks/install-720-runner-duck.yml re-registers it). The
# runner has no Go, so it is installed per job. The host is shared with
# production, which is why compile parallelism is capped below.
# Pushes to main auto-release: the version bump is derived from the
# conventional-commit subjects since the last tag (breaking -> major,
# feat -> minor, anything else -> patch) and action-gh-release creates
# the tag. Manual "v*" tag pushes still release as before; tags created
# here use GITHUB_TOKEN, which never re-triggers this workflow.
on:
  push:
    tags: ["v*"]
    branches: [main]

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Caps parallel package builds because 720 shares its 8 GB with production stacks.
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: compute tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD already tagged, nothing to release"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v*')
          bump=patch
          if git log --format='%s%n%b' "${last}..HEAD" | grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING CHANGE'; then
            bump=major
          elif git log --format='%s' "${last}..HEAD" | grep -qE '^feat(\(.+\))?:'; then
            bump=minor
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          case $bump in
            major) tag="v$((major+1)).0.0" ;;
            minor) tag="v${major}.$((minor+1)).0" ;;
            patch) tag="v${major}.${minor}.$((patch+1))" ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.tag != ''
        with:
          go-version-file: go.mod

      # Standalone statically linked binaries (CGO_ENABLED=0, pure Go):
      # download, chmod +x, run. install.sh depends on this exact naming.
      - name: build binaries
        if: steps.tag.outputs.tag != ''
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "dist/duck_${target%/*}_${target#*/}" .
          done

      - name: create release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
